# 🚀 CONFIGURATION NGINX PRODUCTION
# Portfolio Clément Castex - clementcastex.art

server {
    listen 80;
    server_name clementcastex.art www.clementcastex.art;
    
    # Redirection HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name clementcastex.art www.clementcastex.art;
    
    # SSL Configuration (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/clementcastex.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clementcastex.art/privkey.pem;
    
    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Root directory
    root /var/www/html/portfolio-v3;
    index index.html index.php;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    
    # Frontend React (statique)
    location / {
        try_files $uri $uri/ /index.html;
        
        # Cache statique
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # API Backend Symfony
    location /api {
        try_files $uri /index.php$is_args$args;
    }
    
    # Uploads (images, fichiers)
    location /uploads {
        alias /var/www/html/portfolio-v3/portfolio-backend/public/uploads;
        expires 1y;
        add_header Cache-Control "public";
        
        # Sécurité uploads
        location ~* \.(php|phtml|php3|php4|php5|pl|py|jsp|asp|sh|cgi)$ {
            deny all;
        }
    }
    
    # PHP-FPM pour Symfony
    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        
        # Timeouts
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }
    
    # Sécurité - Bloquer l'accès aux fichiers sensibles
    location ~ /\. {
        deny all;
    }
    
    location ~ /(composer\.(json|lock)|package\.(json|lock)|yarn\.lock|\.env.*)$ {
        deny all;
    }
    
    # Logs
    access_log /var/log/nginx/clementcastex.art.access.log;
    error_log /var/log/nginx/clementcastex.art.error.log;
}

# Configuration pour www -> non-www
server {
    listen 443 ssl http2;
    server_name www.clementcastex.art;
    return 301 https://clementcastex.art$request_uri;
}
